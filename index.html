<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Journal">
<meta name="theme-color" content="#7b3f7c">
<title>Women's Health Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --plum:#7b3f7c; --rose:#c2687c; --plum-light:#f5eef8; --warn:#e65100;
    --warn-light:#fff3e0; --warn-border:#ffb74d; --green:#388e3c;
    --text:#2d1b2e; --muted:#888; --border:#e0d0e8; --bg:#fdf6f0;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,20px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100vh;max-width:560px;margin:0 auto}
  .header{background:linear-gradient(135deg,var(--plum) 0%,var(--rose) 100%);color:white;padding:calc(var(--safe-top) + 18px) 20px 16px;text-align:center;flex-shrink:0}
  .header-eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.8;margin-bottom:3px}
  .header-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:.5px}
  .header-sub{font-size:11px;opacity:.75;margin-top:2px}
  .header-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .header-pill{background:rgba(255,255,255,.22);border-radius:20px;padding:3px 11px;font-size:11px}
  .nav{display:flex;background:white;border-bottom:1px solid var(--border);flex-shrink:0}
  .nav-btn{flex:1;padding:12px 4px;border:none;background:none;cursor:pointer;font-size:11px;font-family:inherit;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s}
  .nav-btn.active{color:var(--plum);border-bottom-color:var(--plum);font-weight:600}
  .scroll{flex:1;overflow-y:auto;padding:16px 14px calc(var(--safe-bottom) + 20px);-webkit-overflow-scrolling:touch}
  .card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(123,63,124,.08);border:1px solid transparent}
  .sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--plum);margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid #e8d5f0;font-weight:600}
  .date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .date-nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:white;font-size:20px;cursor:pointer;color:var(--plum)}
  .date-nav-btn:disabled{opacity:.3}
  .date-main{font-size:16px;font-weight:600;color:var(--plum);text-align:center}
  .date-today{font-size:10px;color:var(--rose);letter-spacing:1px;text-transform:uppercase;margin-top:1px;text-align:center}
  .med-row{display:flex;align-items:center;justify-content:space-between;border-radius:12px;padding:11px 13px;margin-bottom:8px;transition:all .2s}
  .med-name{font-size:13px;font-weight:600;margin-bottom:2px}
  .med-status{font-size:11px}
  .med-btn{padding:8px 15px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:white;transition:all .2s;font-family:inherit}
  .all-taken{margin-top:10px;text-align:center;font-size:12px;color:var(--green);font-weight:600}
  .sev-row{display:flex;gap:6px}
  .sev-btn{flex:1;padding:9px 2px;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit;background:#f5f0f8;color:#999}
  .sym-card{background:white;border-radius:12px;padding:12px 13px;margin-bottom:8px;box-shadow:0 1px 6px rgba(123,63,124,.07);border:1px solid transparent}
  .sym-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sym-name{font-size:13px}
  .sym-badge{font-size:10px;padding:2px 8px;border-radius:20px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:7px 12px;border-radius:20px;border:none;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;background:#f0eaf5;color:#888}
  .chip.active{background:var(--plum);color:white;font-weight:600}
  .chip.active-warn{background:#c62828;color:white;font-weight:600}
  .chip.outline-warn{border:1px dashed var(--warn-border)!important;background:var(--warn-light)!important;color:var(--warn)!important}
  input[type=time],input[type=text],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-family:inherit;font-size:14px;background:white;color:var(--text);outline:none;-webkit-appearance:none}
  textarea{resize:vertical;min-height:80px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  .btn-primary{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--plum),var(--rose));color:white;font-size:15px;font-family:inherit;cursor:pointer;transition:all .3s;font-weight:600}
  .btn-primary.saved{background:var(--green)}
  .btn-secondary{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:white;color:var(--plum);font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:10px;font-weight:500}
  .btn-download{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--plum),var(--rose));color:white;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600}
  .btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--border);background:white;color:var(--plum);font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:12px;font-weight:500}
  /* TIMESTAMP BADGE */
  .ts-badge{display:inline-flex;align-items:center;gap:4px;background:var(--plum-light);color:var(--plum);font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;margin-bottom:8px}
  /* ENTRY BLOCK — for timestamped entries in history */
  .entry-block{border-left:3px solid var(--border);padding-left:12px;margin-bottom:14px}
  .entry-block:last-child{margin-bottom:0}
  .entry-time{font-size:11px;font-weight:600;color:var(--plum);margin-bottom:6px;display:flex;align-items:center;gap:5px}
  /* HISTORY */
  .history-day{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(123,63,124,.07);border:1px solid transparent}
  .history-day.post-con{border-color:var(--warn-border)}
  .history-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .history-date{font-size:14px;font-weight:600;color:var(--plum)}
  .med-dots{display:flex;gap:4px}
  .med-dot{font-size:10px;padding:2px 7px;border-radius:10px}
  .headache-block{border-radius:10px;padding:10px 13px;margin-bottom:6px;font-size:11px}
  .hb-title{font-size:12px;font-weight:600;margin-bottom:4px}
  .sym-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f0f8;font-size:12px}
  .day-note{margin-top:8px;font-size:12px;color:#777;font-style:italic}
  .adh-bar-bg{background:#f0eaf5;border-radius:8px;height:9px;overflow:hidden;margin:4px 0 2px}
  .adh-bar-fill{height:100%;border-radius:8px;transition:width .5s}
  .loading{text-align:center;padding:50px 20px}
  .spinner{font-size:36px;display:inline-block;animation:spin 1.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .summary-text{white-space:pre-wrap;font-size:13px;line-height:1.8;color:var(--text)}
  .summary-placeholder{text-align:center;padding:40px 20px}
  .summary-placeholder .icon{font-size:52px;margin-bottom:16px}
  .summary-placeholder h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--plum);margin-bottom:8px}
  .summary-placeholder p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:24px}
  .btn-generate{padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--plum),var(--rose));color:white;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer}
  .notice{background:var(--warn-light);border:1px solid var(--warn-border);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12px;color:var(--warn);line-height:1.5}
  .field-group{margin-bottom:13px}
  .resolve-chips{display:flex;flex-wrap:wrap;gap:7px}
  .h-quick{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .pc-note{margin-top:10px;padding:8px 12px;background:#ffebee;border-radius:8px;font-size:11px;color:#c62828}
  .divider{border:none;border-top:1px solid #f0eaf5;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-eyebrow">Women's Health</div>
    <div class="header-title">Symptom Journal</div>
    <div class="header-sub">Track · Understand · Share with your doctor</div>
    <div class="header-pills" id="header-pills"></div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" data-view="log"      onclick="switchView('log')">📝 Symptoms</button>
    <button class="nav-btn"        data-view="headache" onclick="switchView('headache')">🤕 Headache</button>
    <button class="nav-btn"        data-view="history"  onclick="switchView('history')">📅 History</button>
    <button class="nav-btn"        data-view="summary"  onclick="switchView('summary')">📋 Summary</button>
  </nav>
  <div class="scroll" id="main"></div>
</div>
<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────
const MEDS=[
  {id:"hrt",    label:"HRT",            icon:"🌸",color:"#7b3f7c",light:"#f5eef8",tb:"#ce93d8"},
  {id:"antidep",label:"Antidepressant", icon:"☀️",color:"#1565c0",light:"#e3f2fd",tb:"#90caf9"},
  {id:"adhd",   label:"ADHD Medication",icon:"⚡",color:"#2e7d32",light:"#e8f5e9",tb:"#a5d6a7"},
];
const SYMPTOMS=[
  {id:"exhaustion",  label:"Exhaustion / Fatigue",      icon:"😴",cat:"energy"},
  {id:"sleep",       label:"Poor Sleep",                 icon:"🌙",cat:"energy"},
  {id:"bloating",    label:"Bloating",                   icon:"🫃",cat:"gut"},
  {id:"cramping",    label:"Abdominal Cramping",         icon:"⚡",cat:"gut"},
  {id:"diarrhea",    label:"Diarrhea / Loose Stool",    icon:"🚽",cat:"gut"},
  {id:"constipation",label:"Constipation",               icon:"🧱",cat:"gut"},
  {id:"hotflash",    label:"Hot Flash / Night Sweat",   icon:"🔥",cat:"menopause"},
  {id:"mood",        label:"Mood Swings / Irritability", icon:"🌊",cat:"menopause"},
  {id:"brainfog",    label:"Brain Fog",                  icon:"🌫️",cat:"menopause"},
  {id:"jointpain",   label:"Joint / Muscle Pain",        icon:"🦴",cat:"pain"},
  {id:"anxiety",     label:"Anxiety",                    icon:"💭",cat:"mental"},
  {id:"focus",       label:"Poor Focus / Concentration", icon:"🎯",cat:"mental"},
];
const CATS=[
  {id:"energy",   label:"Energy & Sleep"},
  {id:"pain",     label:"Pain"},
  {id:"gut",      label:"Gut / IBS"},
  {id:"menopause",label:"Menopause Symptoms"},
  {id:"mental",   label:"Mental & Emotional"},
];
const H_LOCS    =["Forehead","Temples","Back of head","One side only","Top of head","Behind eyes","Whole head"];
const H_TYPES   =["Throbbing","Pressure / tight band","Stabbing","Dull ache","Burning","Post-concussion (familiar feeling)"];
const H_TRIGGERS=["Missed HRT dose","Missed antidepressant","Missed ADHD med","Stress","Hormones","Poor sleep","Dehydration","Bright light","Strong smells","Food / caffeine","Screen time","Weather change","Neck tension","Physical activity","Unknown"];
const SEV_LABELS=["None","Mild","Moderate","Severe"];
const SEV_COLORS=["#e8f5e9","#fff9c4","#ffe0b2","#ffcdd2"];
const SEV_TEXT  =["#388e3c","#f9a825","#e65100","#c62828"];

// ── HELPERS ───────────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split("T")[0];}
function nowTime(){
  const n=new Date();
  return n.getHours().toString().padStart(2,"0")+":"+n.getMinutes().toString().padStart(2,"0");
}
function fmtDate(ds){return new Date(ds+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function fmt12(t){
  if(!t)return"";
  const [h,m]=t.split(":").map(Number);
  const ampm=h>=12?"pm":"am";
  return((h%12)||12)+":"+m.toString().padStart(2,"0")+ampm;
}
function calcStreak(medId){
  let n=0;const d=new Date(todayStr()+"T00:00:00");
  while(true){const k=d.toISOString().split("T")[0];if(state.medsLog[k]?.[medId]){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}

// ── STATE ─────────────────────────────────────────────────────────────────
// entries:   { "2026-04-27": [ {time, symptoms:{id:severity,...}, note} ] }
// headaches: { "2026-04-27": [ {time, severity, locations, types, triggers, medication, relieved} ] }
// medsLog:   { "2026-04-27": { hrt:true, antidep:false, adhd:true } }
function safeLoad(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    // Validate it's the right shape (object, not array or primitive)
    if (typeof parsed !== "object" || Array.isArray(parsed) || parsed === null) return fallback;
    return parsed;
  } catch(e) {
    console.warn("Failed to load", key, e);
    return fallback;
  }
}
// Clear any old-format keys from previous version to avoid conflicts
["hj-entries","hj-headaches","hj-meds","hj-notes"].forEach(k=>localStorage.removeItem(k));

let state={
  view:"log",
  date:todayStr(),
  entries:  safeLoad("hj2-entries",  {}),
  headaches:safeLoad("hj2-headaches",{}),
  medsLog:  safeLoad("hj2-meds",     {}),
  draft:{time:nowTime(), symptoms:{}, note:""},
  hdraft:{time:nowTime(),severity:0,locations:[],types:[],triggers:[],medication:"",relieved:""},
  summary:null,
  genning:false,
};

function persist(){
  localStorage.setItem("hj2-entries",  JSON.stringify(state.entries));
  localStorage.setItem("hj2-headaches",JSON.stringify(state.headaches));
  localStorage.setItem("hj2-meds",     JSON.stringify(state.medsLog));
}

function allDates(){
  return[...new Set([...Object.keys(state.entries),...Object.keys(state.headaches),...Object.keys(state.medsLog)])].sort((a,b)=>b.localeCompare(a));
}
function dayEntries(){return state.entries[state.date]||[];}
function dayHeadaches(){return state.headaches[state.date]||[];}
function dayMeds(){return state.medsLog[state.date]||{};}

// ── MUTATIONS ─────────────────────────────────────────────────────────────
function toggleMed(id){
  if(!state.medsLog[state.date])state.medsLog[state.date]={};
  state.medsLog[state.date][id]=!state.medsLog[state.date][id];
  persist();render();
}
function setDraftSev(id,lv){
  state.draft.symptoms[id]=lv;
  render();
}
function setDraftTime(t){state.draft.time=t;}
function setDraftNote(v){state.draft.note=v;}
function saveSymptomEntry(){
  const hasSym=Object.values(state.draft.symptoms).some(v=>v>0);
  if(!hasSym)return;
  if(!state.entries[state.date])state.entries[state.date]=[];
  state.entries[state.date].push({...state.draft,symptoms:{...state.draft.symptoms}});
  state.draft={time:nowTime(),symptoms:{},note:""};
  persist();render();
}
function setHDraftField(f,v){state.hdraft[f]=v;render();}
function toggleHDraftChip(f,v){
  const cur=state.hdraft[f]||[];
  state.hdraft[f]=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
  render();
}
function saveHeadacheEntry(){
  if(!state.hdraft.severity)return;
  if(!state.headaches[state.date])state.headaches[state.date]=[];
  state.headaches[state.date].push({...state.hdraft,locations:[...state.hdraft.locations],types:[...state.hdraft.types],triggers:[...state.hdraft.triggers]});
  state.hdraft={time:nowTime(),severity:0,locations:[],types:[],triggers:[],medication:"",relieved:""};
  persist();render();
}
function navigate(dir){
  const d=new Date(state.date+"T00:00:00");d.setDate(d.getDate()+dir);
  const n=d.toISOString().split("T")[0];
  if(n<=todayStr()){state.date=n;state.draft={time:nowTime(),symptoms:{},note:""};state.hdraft={time:nowTime(),severity:0,locations:[],types:[],triggers:[],medication:"",relieved:""};render();}
}
function switchView(v){
  state.view=v;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  render();
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────
function dateNavHTML(){
  const isT=state.date===todayStr();
  return`<div class="date-nav">
    <button class="date-nav-btn" onclick="navigate(-1)">‹</button>
    <div><div class="date-main">${fmtDate(state.date)}</div>${isT?'<div class="date-today">Today</div>':""}</div>
    <button class="date-nav-btn" onclick="navigate(1)" ${isT?"disabled":""}>›</button>
  </div>`;
}
function medPanelHTML(){
  const dm=dayMeds();const allTaken=MEDS.every(m=>dm[m.id]);
  const rows=MEDS.map(m=>{
    const taken=dm[m.id]||false;const streak=calcStreak(m.id);
    return`<div class="med-row" style="background:${taken?m.light:"#fffaf4"};border:1.5px solid ${taken?m.tb:"#ffcc80"}">
      <div>
        <div class="med-name">${m.icon} ${m.label}${taken&&streak>1?`<span style="font-size:10px;color:#aaa;font-weight:400;margin-left:6px">🔥${streak}d</span>`:""}</div>
        <div class="med-status" style="color:${taken?"#666":"var(--warn)"}">${taken?"Taken ✓":state.date===todayStr()?"⚠️ Not logged yet":"Not logged"}</div>
      </div>
      <button class="med-btn" style="background:${taken?m.color:"var(--warn)"}" onclick="toggleMed('${m.id}')">${taken?"✓ Taken":"Mark Taken"}</button>
    </div>`;
  }).join("");
  return`<div class="card"><div class="sec-lbl">Daily Medications</div>${rows}${allTaken?'<div class="all-taken">🎉 All medications taken today!</div>':""}</div>`;
}
function sevBtnsHTML(cur,fn){
  return`<div class="sev-row">${[0,1,2,3].map(lv=>{
    const a=cur===lv;
    return`<button class="sev-btn" style="background:${a?(lv===0?"#e8f5e9":SEV_COLORS[lv]):"#f5f0f8"};color:${a?(lv===0?"#388e3c":SEV_TEXT[lv]):"#999"};font-weight:${a?"600":"400"};transform:${a?"scale(1.04)":"scale(1)"}" onclick="${fn}(${lv})">${SEV_LABELS[lv]}</button>`;
  }).join("")}</div>`;
}
function chipsHTML(items,selected,fn){
  return`<div class="chips">${items.map(item=>{
    const a=selected.includes(item);
    const isPC=item==="Post-concussion (familiar feeling)";
    const isMed=item.startsWith("Missed");
    let cls="chip"+(a?(isPC?" active-warn":" active"):(isPC||isMed?" outline-warn":""));
    const lbl=isPC?"⚠️ "+item:isMed?"💊 "+item:item;
    return`<button class="${cls}" onclick="${fn}('${item.replace(/'/g,"\\'")}')"> ${lbl}</button>`;
  }).join("")}</div>`;
}

// ── LOG VIEW ──────────────────────────────────────────────────────────────
function renderLog(){
  const de=state.draft;
  const existing=dayEntries();
  let html=dateNavHTML()+medPanelHTML();

  // Headache quick-link — show count of today's headaches
  const hCount=dayHeadaches().length;
  html+=`<div class="card h-quick" onclick="switchView('headache')" style="${hCount>0?"background:#fff5f5;border-color:#e57373":""}">
    <div>
      <div style="font-size:14px">🤕 Headache</div>
      <div style="font-size:12px;color:${hCount>0?"#c62828":"#bbb"};margin-top:3px">${hCount>0?`${hCount} entry${hCount>1?"ies":""} today · tap to add more`:"Tap to log headache →"}</div>
    </div>
    <div style="font-size:20px">${hCount>0?"🔴":"➕"}</div>
  </div>`;

  // Previous entries for today
  if(existing.length>0){
    html+=`<div class="card" style="padding:14px 16px"><div class="sec-lbl">Logged today</div>`;
    existing.forEach((e,i)=>{
      const syms=SYMPTOMS.filter(s=>(e.symptoms[s.id]||0)>0);
      html+=`<div class="entry-block">
        <div class="entry-time">🕐 ${fmt12(e.time)}</div>
        ${syms.map(s=>`<div class="sym-row"><span>${s.icon} ${s.label}</span><span class="sym-badge" style="background:${SEV_COLORS[e.symptoms[s.id]]};color:${SEV_TEXT[e.symptoms[s.id]]}">${SEV_LABELS[e.symptoms[s.id]]}</span></div>`).join("")}
        ${e.note?`<div class="day-note">📝 ${e.note}</div>`:""}
      </div>`;
      if(i<existing.length-1)html+=`<hr class="divider">`;
    });
    html+=`</div>`;
  }

  // New entry form
  html+=`<div class="card">
    <div class="sec-lbl">New Entry ${existing.length>0?"— Add Another":""}</div>
    <div style="margin-bottom:12px">
      <label>Time of symptoms</label>
      <input type="time" id="sym-time" value="${de.time}" onchange="setDraftTime(this.value)">
    </div>`;

  CATS.forEach(cat=>{
    const catS=SYMPTOMS.filter(s=>s.cat===cat.id);
    html+=`<div style="margin-bottom:14px"><div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#aaa;font-weight:600;margin-bottom:8px">${cat.label}</div>`;
    catS.forEach(s=>{
      const val=de.symptoms[s.id]||0;
      html+=`<div class="sym-card" style="border-color:${val>0?SEV_COLORS[val]:"transparent"}">
        <div class="sym-header">
          <span class="sym-name">${s.icon} ${s.label}</span>
          ${val>0?`<span class="sym-badge" style="background:${SEV_COLORS[val]};color:${SEV_TEXT[val]}">${SEV_LABELS[val]}</span>`:""}
        </div>
        ${sevBtnsHTML(val,`setDraftSev_${s.id}`)}
      </div>`;
    });
    html+=`</div>`;
  });

  html+=`<div style="margin-bottom:14px">
      <label>Notes for this entry</label>
      <textarea id="sym-note" placeholder="What's happening? Food, stress, activity…" onchange="setDraftNote(this.value)">${de.note}</textarea>
    </div>
    <button class="btn-primary" id="save-sym-btn" onclick="saveAndFlash()">＋ Save This Entry</button>
  </div>`;

  return html;
}

// ── HEADACHE VIEW ─────────────────────────────────────────────────────────
function renderHeadache(){
  const hd=state.hdraft;
  const existing=dayHeadaches();
  let html=dateNavHTML()+medPanelHTML();

  html+=`<div class="notice">⚠️ <strong>Concussion history noted (2016).</strong> Select "Post-concussion" below if this feels like those headaches.</div>`;

  // Previous headaches today
  if(existing.length>0){
    html+=`<div class="card" style="padding:14px 16px"><div class="sec-lbl">Headaches logged today</div>`;
    existing.forEach((h,i)=>{
      const isPC=h.types?.includes("Post-concussion (familiar feeling)");
      html+=`<div class="entry-block">
        <div class="entry-time">🕐 ${fmt12(h.time)} ${isPC?"⚠️":""}</div>
        <div class="headache-block" style="background:${isPC?"#fff3e0":"#fff5f5"};border:1px solid ${isPC?"#ffb74d":"#ffcdd2"};margin-bottom:0">
          <div class="hb-title" style="color:${isPC?"#e65100":"#c62828"}">${SEV_LABELS[h.severity]}${isPC?" · POST-CONCUSSION":""}</div>
          ${h.locations?.length>0?`<div>📍 ${h.locations.join(", ")}</div>`:""}
          ${h.types?.length>0?`<div>💢 ${h.types.join(", ")}</div>`:""}
          ${h.triggers?.length>0?`<div>⚡ ${h.triggers.join(", ")}</div>`:""}
          ${h.medication?`<div>💊 ${h.medication}</div>`:""}
          ${h.relieved?`<div>✅ ${h.relieved}</div>`:""}
        </div>
      </div>`;
      if(i<existing.length-1)html+=`<hr class="divider">`;
    });
    html+=`</div>`;
  }

  // New headache form
  html+=`<div class="card">
    <div class="sec-lbl">Log ${existing.length>0?"Another Headache":"Headache"}</div>
    <div class="field-group">
      <label>Time headache started</label>
      <input type="time" value="${hd.time}" onchange="setHDraftField('time',this.value)">
    </div>
    <div class="field-group">
      <label>Severity</label>
      <div class="sev-row">${[0,1,2,3].map(lv=>{
        const a=hd.severity===lv;
        return`<button class="sev-btn" style="background:${a?(lv===0?"#e8f5e9":SEV_COLORS[lv]):"#f5f0f8"};color:${a?(lv===0?"#388e3c":SEV_TEXT[lv]):"#999"};font-weight:${a?"600":"400"};transform:${a?"scale(1.04)":"scale(1)"}" onclick="setHDraftField('severity',${lv})">${lv===0?"None":["😐","😣","😫"][lv-1]+" "+SEV_LABELS[lv]}</button>`;
      }).join("")}</div>
    </div>`;

  if(hd.severity>0){
    html+=`<div class="field-group">
      <label>Where is the pain?</label>
      ${chipsHTML(H_LOCS,hd.locations||[],"toggleHLoc")}
    </div>
    <div class="field-group">
      <label>What does it feel like?</label>
      ${chipsHTML(H_TYPES,hd.types||[],"toggleHType")}
      ${(hd.types||[]).includes("Post-concussion (familiar feeling)")?'<div class="pc-note">This will be flagged in your doctor summary.</div>':""}
    </div>
    <div class="field-group">
      <label>Possible triggers?</label>
      ${chipsHTML(H_TRIGGERS,hd.triggers||[],"toggleHTrigger")}
    </div>
    <div class="field-group">
      <label>Pain relief taken</label>
      <input type="text" value="${hd.medication||""}" placeholder="e.g. Ibuprofen 400mg, none" onchange="setHDraftField('medication',this.value)">
    </div>
    <div class="field-group">
      <label>Did it resolve?</label>
      <div class="resolve-chips">${["Yes — fully","Partially","No","Still ongoing"].map(opt=>`<button class="chip ${hd.relieved===opt?"active":""}" onclick="setHDraftField('relieved','${opt}')">${opt}</button>`).join("")}</div>
    </div>`;
  }

  html+=`<button class="btn-primary" id="save-h-btn" onclick="saveHAndFlash()" ${hd.severity===0?"disabled style='opacity:.5'":""}>＋ Save Headache Entry</button>
  </div>`;

  return html;
}

// ── HISTORY VIEW ──────────────────────────────────────────────────────────
function renderHistory(){
  const dates=allDates();
  let html=`<h2 style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--plum);margin-bottom:6px">History</h2>`;

  if(Object.keys(state.medsLog).length>0){
    html+=`<div class="card" style="margin-bottom:16px"><div class="sec-lbl">Medication Adherence</div>`;
    MEDS.forEach(m=>{
      const logged=dates.filter(d=>state.medsLog[d]?.[m.id]!==undefined).length;
      const taken=dates.filter(d=>state.medsLog[d]?.[m.id]===true).length;
      const pct=logged>0?Math.round(taken/logged*100):0;
      const col=pct>=80?"#388e3c":pct>=50?"#f9a825":"#c62828";
      const streak=calcStreak(m.id);
      html+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px">
          <span>${m.icon} ${m.label}</span><strong style="color:${col}">${logged>0?pct+"%":"Not tracked"}</strong>
        </div>
        ${logged>0?`<div class="adh-bar-bg"><div class="adh-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <div style="font-size:10px;color:#aaa">${taken}/${logged} days${streak>0?` · 🔥 ${streak}-day streak`:""}</div>`:""}
      </div>`;
    });
    html+=`</div>`;
  }

  if(dates.length===0){
    html+=`<div style="text-align:center;color:#aaa;padding:40px 0">No entries yet — start logging!</div>`;
  }

  dates.forEach(d=>{
    const entries=state.entries[d]||[];
    const headaches=state.headaches[d]||[];
    const md=state.medsLog[d]||{};
    const hasPC=headaches.some(h=>h.types?.includes("Post-concussion (familiar feeling)"));
    const hasAnything=entries.length>0||headaches.length>0||Object.keys(md).length>0;
    if(!hasAnything)return;

    html+=`<div class="history-day ${hasPC?"post-con":""}">
      <div class="history-day-header">
        <div class="history-date">${fmtDate(d)}</div>
        <div class="med-dots">${MEDS.map(m=>`<span class="med-dot" style="background:${md[m.id]===true?m.light:md[m.id]===false?"#fff3e0":"#f5f5f5"};color:${md[m.id]===true?m.color:md[m.id]===false?"#e65100":"#bbb"}">${m.icon}${md[m.id]===true?"✓":md[m.id]===false?"✗":"—"}</span>`).join("")}</div>
      </div>`;

    // Headaches — each timestamped
    if(headaches.length>0){
      html+=`<div style="margin-bottom:10px"><div style="font-size:10px;color:#aaa;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">🤕 Headaches</div>`;
      headaches.forEach(h=>{
        const isPC=h.types?.includes("Post-concussion (familiar feeling)");
        html+=`<div class="entry-block">
          <div class="entry-time">🕐 ${fmt12(h.time)||"—"}</div>
          <div class="headache-block" style="background:${isPC?"#fff3e0":"#fff5f5"};border:1px solid ${isPC?"#ffb74d":"#ffcdd2"};margin-bottom:0">
            <div class="hb-title" style="color:${isPC?"#e65100":"#c62828"}">${isPC?"⚠️ ":""}${SEV_LABELS[h.severity]}${isPC?" · POST-CONCUSSION":""}</div>
            ${h.locations?.length>0?`<div>📍 ${h.locations.join(", ")}</div>`:""}
            ${h.types?.length>0?`<div>💢 ${h.types.join(", ")}</div>`:""}
            ${h.triggers?.length>0?`<div>⚡ ${h.triggers.join(", ")}</div>`:""}
            ${h.medication?`<div>💊 ${h.medication}</div>`:""}
            ${h.relieved?`<div>✅ ${h.relieved}</div>`:""}
          </div>
        </div>`;
      });
      html+=`</div>`;
    }

    // Symptom entries — each timestamped
    if(entries.length>0){
      html+=`<div><div style="font-size:10px;color:#aaa;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">📝 Symptoms</div>`;
      entries.forEach((e,i)=>{
        const syms=SYMPTOMS.filter(s=>(e.symptoms[s.id]||0)>0);
        if(syms.length===0&&!e.note)return;
        html+=`<div class="entry-block">
          <div class="entry-time">🕐 ${fmt12(e.time)||"—"}</div>
          ${syms.map(s=>`<div class="sym-row"><span>${s.icon} ${s.label}</span><span class="sym-badge" style="background:${SEV_COLORS[e.symptoms[s.id]]};color:${SEV_TEXT[e.symptoms[s.id]]}">${SEV_LABELS[e.symptoms[s.id]]}</span></div>`).join("")}
          ${e.note?`<div class="day-note">📝 ${e.note}</div>`:""}
        </div>`;
        if(i<entries.length-1)html+=`<hr class="divider">`;
      });
      html+=`</div>`;
    }

    html+=`</div>`;
  });

  return html;
}

// ── SUMMARY VIEW ──────────────────────────────────────────────────────────
function renderSummary(){
  if(state.genning)return`<div class="loading"><div class="spinner">⏳</div><div style="font-size:15px;color:var(--plum);margin-top:16px">Analysing your data…</div><div style="font-size:12px;color:#aaa;margin-top:6px">Claude is reviewing your symptoms,<br>headaches, and medications</div></div>`;
  if(!state.summary){
    const hasData=allDates().length>0;
    return`<div class="summary-placeholder">
      <div class="icon">📋</div>
      <h3>Create Your Doctor Summary</h3>
      <p>Claude will analyse all your logged symptoms, headaches, and medication data and write a clear summary you can share at your next appointment.</p>
      ${hasData?`<button class="btn-generate" onclick="generateSummary()">✨ Generate Summary</button>`:`<p style="color:var(--warn);font-size:13px">Log some symptoms first, then come back.</p>`}
    </div>`;
  }
  return`<h2 style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--plum);margin-bottom:6px">Doctor Summary</h2>
    <p style="font-size:12px;color:#aaa;margin-bottom:16px">AI-generated from your data. Review before sharing.</p>
    <div class="card"><div class="summary-text">${state.summary.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div></div>
    <div class="notice">⚠️ For informational purposes only. Not medical advice.</div>
    <button class="btn-secondary" onclick="generateSummary()">🔄 Regenerate</button>
    <button class="btn-download" onclick="downloadSummary()">⬇️ Download (.txt)</button>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────
function render(){
  try{
    const pills=document.getElementById("header-pills");
    if(pills){
      if(state.date===todayStr()){
        const dm=dayMeds();
        pills.innerHTML=MEDS.filter(m=>!dm[m.id]).map(m=>`<span class="header-pill">${m.icon} Take your ${m.label}</span>`).join("");
      }else pills.innerHTML="";
    }
    const views={log:renderLog,headache:renderHeadache,history:renderHistory,summary:renderSummary};
    const main=document.getElementById("main");
    if(main) main.innerHTML=views[state.view]?.()||"";
    SYMPTOMS.forEach(s=>{ window[`setDraftSev_${s.id}`]=lv=>{setDraftSev(s.id,lv);}; });
    window.toggleHLoc    =v=>toggleHDraftChip("locations",v);
    window.toggleHType   =v=>toggleHDraftChip("types",v);
    window.toggleHTrigger=v=>toggleHDraftChip("triggers",v);
    const ta=document.getElementById("sym-note");
    if(ta)ta.value=state.draft.note;
  }catch(err){
    console.error("Render error:",err);
    const main=document.getElementById("main");
    if(main)main.innerHTML=`<div style="padding:30px;text-align:center;color:#c62828;font-family:sans-serif">
      <div style="font-size:32px;margin-bottom:12px">⚠️</div>
      <div style="font-size:14px;margin-bottom:8px">Something went wrong. Tap below to reset.</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:20px">${err.message}</div>
      <button onclick="localStorage.clear();location.reload()" style="padding:10px 20px;border-radius:10px;border:none;background:#7b3f7c;color:white;font-size:13px;cursor:pointer">Reset &amp; Reload</button>
    </div>`;
  }
}

function saveAndFlash(){
  saveSymptomEntry();
  // render already called inside saveSymptomEntry
}
function saveHAndFlash(){
  saveHeadacheEntry();
}

// ── SUMMARY GENERATION ────────────────────────────────────────────────────
async function generateSummary(){
  state.genning=true;state.summary=null;switchView("summary");
  const dates=allDates();
  const allHeadaches=dates.flatMap(d=>(state.headaches[d]||[]).map(h=>({...h,date:fmtDate(d)})));
  const pcHeadaches=allHeadaches.filter(h=>h.types?.includes("Post-concussion (familiar feeling)"));
  const symTotals={};SYMPTOMS.forEach(s=>symTotals[s.id]=0);
  dates.forEach(d=>(state.entries[d]||[]).forEach(e=>SYMPTOMS.forEach(s=>{symTotals[s.id]+=(e.symptoms[s.id]||0);})));
  const topSyms=SYMPTOMS.map(s=>({...s,total:symTotals[s.id]})).filter(s=>s.total>0).sort((a,b)=>b.total-a.total);
  const medAdh=MEDS.map(m=>{
    const logged=dates.filter(d=>state.medsLog[d]?.[m.id]!==undefined).length;
    const taken=dates.filter(d=>state.medsLog[d]?.[m.id]===true).length;
    return{label:m.label,taken,logged,pct:logged>0?Math.round(taken/logged*100):null};
  });
  const dailyLog=dates.slice(0,30).map(d=>({
    date:fmtDate(d),
    symptomEntries:(state.entries[d]||[]).map(e=>({time:fmt12(e.time),symptoms:SYMPTOMS.filter(s=>(e.symptoms[s.id]||0)>0).map(s=>`${s.label}: ${SEV_LABELS[e.symptoms[s.id]]}`),note:e.note})),
    headaches:(state.headaches[d]||[]).map(h=>({time:fmt12(h.time),severity:SEV_LABELS[h.severity],locations:h.locations,types:h.types,triggers:h.triggers,medication:h.medication,relieved:h.relieved})),
    meds:MEDS.map(m=>({name:m.label,taken:state.medsLog[d]?.[m.id]??null})),
  }));
  const prompt=`You are a medical scribe helping a patient prepare a summary for their doctor.
Patient: Female, 51, menopausal, overweight. Medications: HRT, antidepressant, ADHD meds (often forgets). Concussion history: 2016. Main concerns: exhaustion, headaches (some post-concussion type), IBS.
Data: ${dates.length} days tracked. ${allHeadaches.length} headache events. ${pcHeadaches.length} post-concussion type.
Top symptoms: ${topSyms.slice(0,5).map(s=>`${s.label}(${s.total}pts)`).join(", ")||"none"}.
Adherence: ${medAdh.map(m=>m.pct!==null?`${m.label}:${m.pct}%(${m.taken}/${m.logged}d)`:`${m.label}:untracked`).join(", ")}.
Log (timestamped): ${JSON.stringify(dailyLog,null,2)}
Write a professional doctor-ready summary with sections: 1.Patient Overview 2.Primary Concerns 3.Symptom Patterns (note times of day if patterns exist) 4.Medication Adherence (correlations with symptoms) 5.Headache Analysis (flag post-concussion prominently) 6.Suggested Questions (5-7). Cite specific times/numbers. Plain language.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    state.summary=data.content?.find(b=>b.type==="text")?.text||"Could not generate summary.";
  }catch(e){state.summary="Error connecting. Check your internet connection and try again.";}
  state.genning=false;render();
}
function downloadSummary(){
  if(!state.summary)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([state.summary],{type:"text/plain"}));
  a.download="health-summary-for-doctor.txt";a.click();
}

render();
</script>
</body>
</html>
